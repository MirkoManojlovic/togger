name: PR Preview Deploy

# Publishes the preview that the job "Frontend preview" of pr-checks.yml built to Cloudflare Pages, one URL per pull
# request, and links it in a comment.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and a Pages project named togger-preview.
# It runs on the default branch and only uploads static files; it never runs code of the pull request.

on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  # most pull requests have no preview label and so no preview build; this keeps them out of the environment below
  find-build:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      found: ${{ steps.artifact.outputs.found }}
    steps:
      - name: Look for the preview build
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "pr-preview-build" and (.expired | not))] | length')
          echo "preview builds in the run: $count"
          echo "found=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy-preview:
    needs: find-build
    if: needs.find-build.outputs.found == 'true'
    # a newer build of the same branch supersedes this one
    concurrency:
      group: pr-preview-deploy-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-deployments
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pr-preview-build
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Get the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          REPO_OWNER: ${{ github.event.workflow_run.repository.owner.login }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_OWNER" != "$REPO_OWNER" ]; then
            BRANCH="${HEAD_OWNER}:${HEAD_BRANCH}"
          else
            BRANCH="${HEAD_BRANCH}"
          fi

          PR_NUMBER=$(gh pr view --repo "$REPO" "$BRANCH" --json number --jq '.number')
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine the pull request number"
            exit 1
          fi

          SAFE_BRANCH=$(echo "$HEAD_BRANCH" | sed 's/[^a-zA-Z0-9._\/-]//g')

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_branch=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # aliased by the pull request number, not by the branch, so a fork branch can never take over another alias
      - name: Deploy to Cloudflare Pages
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=togger-preview --branch=pr-${{ steps.pr.outputs.number }}

      - name: Find the existing comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- pr-preview-comment -->"

      - name: Create or update the comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          edit-mode: replace
          body: |
            <!-- pr-preview-comment -->
            ## Preview Deployment

            | Status | URL |
            |--------|-----|
            | Deployed | ${{ steps.cloudflare-deploy.outputs.deployment-url }} |

            **Branch:** `${{ steps.pr.outputs.head_branch }}`
            **Commit:** ${{ steps.pr.outputs.head_sha }}

            The preview runs the frontend only (frontend preview mode): there is no backend and all data lives in your
            browser. Log in with `admin@email.com` / `A!good_1_password_is_good`.

            ---
            <sub>Deployed with Cloudflare Pages</sub>

  # This workflow runs for every run of "PR Checks". The ones that a newer push cancelled leave a run of this workflow
  # with every job skipped, and a newer deploy cancels the running one of the same pull request; both stay in the
  # history. A run that went through (a run of this workflow has the branch develop, not the one of the pull request)
  # deletes them. It never runs code of the pull request: it checks out develop.
  clean-up:
    name: Delete cancelled and skipped runs
    needs: [find-build, deploy-preview]
    if: ${{ !cancelled() && needs.find-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Delete the cancelled and skipped runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          STATUSES: cancelled skipped
        run: .github/scripts/delete-cancelled-runs.sh
