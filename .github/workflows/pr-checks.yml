name: PR Checks

# One build for every pull request into develop: everything compiles (main and test code of all projects, the ScalaJS
# frontend included), then every test passes. Both run in one sbt server, so the code is compiled only once. The build
# has no explicit root project, so sbt aggregates all of them at the root. The job "PR Checks" sums the build up; it is
# the status check the ruleset of develop requires.
#
# A pull request with the label "👀 preview" also gets a frontend preview (no backend, data in localStorage). Its job
# starts after the build and restores the compiled output the build saved, so it only links and bundles the frontend;
# pr-preview-deploy.yml publishes the result. The preview does not count for "PR Checks". Adding a label runs the whole
# workflow again (so the preview starts when its label is added); a skipped build would hide a failed one of the same
# commit behind a green "PR Checks".
#
# The sbt dependencies and the sbt 2 task cache are cached (see the cache step). A cache is only readable from its own
# branch and from the default branch, so develop runs the build too (on every merge) to keep a warm cache for the pull
# requests.

on:
  push:
    branches: [develop]
    paths-ignore:
      - "**/*.md"
      - "claude_files/**"
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled]
    # only documentation changed, nothing to compile or test
    paths-ignore:
      - "**/*.md"
      - "claude_files/**"

permissions:
  contents: read

env:
  # see the comment at ThisBuild / version in build.sbt
  TOGGER_FIXED_VERSION: ci

# a newer push to the pull request supersedes the running checks
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # the backend specs run against a real Postgres database, see TgTestTransactor; the schema needs uuidv7(), so 18.
    # Every spec clones its own database from togger-test (TgTestDatabase), so the role must be allowed to create one
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: togger_account
          POSTGRES_PASSWORD: togger_password
          POSTGRES_DB: togger-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U togger_account -d togger-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt # the dependencies, keyed by the build files

      - uses: sbt/setup-sbt@v1
        with:
          disk-cache: false # the cache step below keeps it

      # the sbt 2 disk cache (~/.cache/sbt, where the results of the tasks are stored by the hash of their inputs) and the
      # target directories (links into it): a project whose inputs did not change is not compiled or linked again. A cache
      # entry cannot be updated, so the key has the hash of the sources: a hit means nothing changed, a miss restores the
      # newest cache of the branch or develop and saves what the build adds to it
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sbt
            target
            project/target
            project/project/target
            **/target
            !target/test-data-export-*
            !src-tauri/target
            !liquibase/target
          key: sbt-cache-${{ runner.os }}-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/*.scala', '**/*.scala', '**/*.java') }}
          restore-keys: |
            sbt-cache-${{ runner.os }}-

      # the frontend specs run on node
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create the schema of the test database
        run: |
          # the Liquibase image does not ship the Postgres JDBC driver
          curl -fsSLo postgresql.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.7/postgresql-42.7.7.jar
          docker run --rm --network host \
            -v "$PWD/b-05-database/src/main/resources/liquibase:/liquibase/changelog" \
            -v "$PWD/postgresql.jar:/liquibase/lib/postgresql.jar" \
            liquibase/liquibase:5.0.4 \
            --search-path=/liquibase/changelog \
            --changelog-file=changelog.yaml \
            --url=jdbc:postgresql://localhost:5432/togger-test \
            --username=togger_account \
            --password=togger_password \
            update

      # one step and so one sbt server for both commands: the test run reuses what the compile built. The specs of a
      # project work on their own cloned databases, so all projects are tested in one go; sbt runs every project even
      # after a failure in another one
      - name: Compile and test
        run: |
          echo "::group::Test/compile"
          sbt --client Test/compile
          echo "::endgroup::"
          status=0
          sbt --client test || status=$?
          sbt --client shutdown || true
          exit $status

  preview:
    name: Frontend preview
    needs: [build]
    if: contains(github.event.pull_request.labels.*.name, '👀 preview')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1
        with:
          disk-cache: false # the cache step below keeps it

      # what the build job saved for these exact sources; the key must be the same as there
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/sbt
            target
            project/target
            project/project/target
            **/target
            !target/test-data-export-*
            !src-tauri/target
            !liquibase/target
          key: sbt-cache-${{ runner.os }}-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/*.scala', '**/*.scala', '**/*.java') }}
          restore-keys: |
            sbt-cache-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # everything is compiled already, this only runs the optimiser
      - name: Link the ScalaJS frontend
        run: sbt frontendMain/fullLinkJS

      - name: Build the preview
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export PREVIEW_BUILD_ID="$(echo "$HEAD_SHA" | cut -c1-8)"
          npm run build-preview

      - uses: actions/upload-artifact@v4
        with:
          name: pr-preview-build
          path: dist
          retention-days: 1

  # the ruleset of develop requires one status check named "PR Checks"; it is green when the build above is
  pr-checks:
    name: PR Checks
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both checks passed
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "compile and test: $RESULT"
          [ "$RESULT" = "success" ]
