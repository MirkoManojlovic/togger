name: Develop Preview

# Builds the frontend in preview mode (no backend, data in localStorage) after every merge into develop and publishes it
# to the stable URL https://togger-preview.pages.dev. develop must be the production branch of the Cloudflare Pages
# project: production deployments are served on the root domain and get no branch alias, and every deployment also
# keeps its own <hash>.togger-preview.pages.dev URL.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, see pr-preview-deploy.yml.

on:
  push:
    branches: [develop]
    # the backend, the desktop shell and the docs do not change the preview
    paths-ignore:
      - "**/*.md"
      - "claude_files/**"
      - "b-*/**"
      - "src-tauri/**"
      - ".github/workflows/release-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # the same version as in the PR checks, see ThisBuild / version in build.sbt; the frontend does not show it
  TOGGER_FIXED_VERSION: ci

# a newer merge supersedes the running build
concurrency:
  group: develop-preview
  cancel-in-progress: true

jobs:
  deploy-develop-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview-deployments
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: sbt # the dependencies, keyed by the build files

      - uses: sbt/setup-sbt@v1
        with:
          disk-cache: false # the cache of the PR checks is used instead

      # the sbt cache that the PR checks of the previous merge saved on develop (they run on every push to develop, this
      # build runs at the same time, so it cannot wait for the one of its own commit); only the changes since then are
      # compiled. This build only reads, the PR checks keep the cache.
      - uses: ./.github/actions/sbt-cache

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Link the ScalaJS frontend
        run: sbt frontendMain/fullLinkJS

      - name: Build the preview
        run: |
          export PREVIEW_BUILD_ID="$(echo "$GITHUB_SHA" | cut -c1-8)"
          npm run build-preview

      # develop is the branch alias, so every deployment replaces the previous one at the same URL
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=togger-preview --branch=develop

      # every deployment keeps its own <hash> URL, so the old ones pile up with every merge
      - name: Delete the old deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: togger-preview
          KEEP: "10"
        run: .github/scripts/prune-pages-deployments.sh

  # the runs that a newer merge cancelled stay in the history; the run that survived deletes them
  clean-up:
    name: Delete cancelled runs
    needs: [deploy-develop-preview]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Delete the cancelled runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: .github/scripts/delete-cancelled-runs.sh
