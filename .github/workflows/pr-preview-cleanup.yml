name: PR Preview Cleanup

# Deletes the Cloudflare Pages deployments of a pull request once it is closed or merged. pull_request_target gives
# fork pull requests access to the secrets; this workflow never checks out or runs code of the pull request.

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview-deployments
    steps:
      - name: Delete the preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: togger-preview
          BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}/deployments"

          # prints the body of the response, and fails with it when Cloudflare answers with an error
          cloudflare() {
            local response status
            response=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$@")
            status="${response##*$'\n'}"
            if [ "${status:0:1}" != "2" ]; then
              echo "::error::Cloudflare answered $status: ${response%$'\n'*}" >&2
              return 1
            fi
            echo "${response%$'\n'*}"
          }

          # every page of the preview deployments, collecting the ids that were deployed for the branch of the pull request
          IDS=""
          PAGE=1
          while true; do
            RESPONSE=$(cloudflare "${API}?env=preview&page=${PAGE}")
            IDS="$IDS $(echo "$RESPONSE" | jq -r --arg branch "$BRANCH" \
              '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id')"
            TOTAL_PAGES=$(echo "$RESPONSE" | jq -r '.result_info.total_pages // 1')
            [ "$PAGE" -lt "$TOTAL_PAGES" ] || break
            PAGE=$((PAGE + 1))
          done

          # a deployment that is still the alias of its branch needs force=true to be deleted
          for ID in $IDS; do
            echo "Deleting deployment $ID of $BRANCH"
            cloudflare -X DELETE "${API}/${ID}?force=true" > /dev/null
          done
          echo "Deleted $(echo $IDS | wc -w) deployments of $BRANCH"

      - name: Find the preview comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- pr-preview-comment -->"

      - name: Mark the preview as removed
        if: steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- pr-preview-comment -->
            ## Preview Deployment

            The preview was removed because the pull request is closed.

            ---
            <sub>Deployed with Cloudflare Pages</sub>
