name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release, e.g. v0.1.0
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0 # sbt-dynver derives the version from the tags

      - name: Check the tag matches the app version
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$app_version" = "$RELEASE_TAG" ] || { echo "tag $RELEASE_TAG != app version $app_version"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: sbt/setup-sbt@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: extractions/setup-just@v2

      - run: npm ci

      - run: just build-tauri-backend prod

      - run: just build-tauri-mcp

      - name: Build the release notes
        id: notes
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            .github/scripts/release-notes.sh "$RELEASE_TAG"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Togger ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true # an immutable release accepts no assets once published, so it is published below
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin --verbose

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false
