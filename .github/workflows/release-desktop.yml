name: Release desktop app

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sbt-dynver derives the version from the tags

      - name: Check the tag matches the app version
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$app_version" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} != app version $app_version"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: sbt/setup-sbt@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: extractions/setup-just@v2

      - run: npm ci

      - run: just build-tauri-backend prod

      - run: just build-tauri-mcp

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: Togger ${{ github.ref_name }}
          releaseDraft: false
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin
