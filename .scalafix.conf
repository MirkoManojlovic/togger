rules = [
  RemoveUnused
  OrganizeImports
  LeakingImplicitClassVal
  NoAutoTupling
  NoValInForComprehension
  RedundantSyntax
  ProcedureSyntax
]

RemoveUnused {
  imports = false
  privates = true
  locals = true
  patternvars = true
  params = false
}

RedundantSyntax.finalObject = true

OrganizeImports.blankLines = Auto
OrganizeImports.expandRelative = false
OrganizeImports.groupSeparately = [ByTypeGivens]
OrganizeImports.groupedImports = Explode
OrganizeImports.groups = [
  "*",
  "re:(javax?|scala)\\."
]
OrganizeImports.importSelectorsOrder = Ascii
OrganizeImports.importsOrder = Ascii
OrganizeImports.removeUnused = true
OrganizeImports.targetDialect = StandardLayout
