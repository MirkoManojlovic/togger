  - changeSet:
      id: 19
      author: mirko
      labels: milestone-template
      comment: >
        Milestone templates: a project-scoped name and description with an ordered list of milestone step templates,
        with an append-only history of versions. The steps belong to a version. A step template that is deleted
        disappears from the steps of the versions that listed it.
      changes:
        - createTable:
            tableName: milestone_template
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: uuidv7()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: project_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_milestone_template_project
                    references: project(id)
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_milestone_template_created_by_account
                    references: account(id)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: milestone_template_version
            columns:
              - column:
                  name: version
                  type: uuid
                  defaultValueComputed: uuidv7()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: milestone_template_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_milestone_template_version_template
                    references: milestone_template(id)
                    deleteCascade: true
              - column:
                  name: name
                  type: varchar(256)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: milestone_template_version_step
            columns:
              - column:
                  name: milestone_template_version
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_milestone_template_version_step_version
                    references: milestone_template_version(version)
                    deleteCascade: true
              - column:
                  name: position
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: milestone_step_template_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_milestone_template_version_step_step_template
                    references: milestone_step_template(id)
                    deleteCascade: true
        - addPrimaryKey:
            tableName: milestone_template_version_step
            columnNames: milestone_template_version, position
            constraintName: pk_milestone_template_version_step
        - createIndex:
            indexName: idx_milestone_template_version_step_step_template_id
            tableName: milestone_template_version_step
            columns:
              - column:
                  name: milestone_step_template_id
        - createIndex:
            indexName: idx_milestone_template_project_id
            tableName: milestone_template
            columns:
              - column:
                  name: project_id
        - createIndex:
            indexName: idx_milestone_template_version_template_id_version
            tableName: milestone_template_version
            columns:
              - column:
                  name: milestone_template_id
              - column:
                  name: version
                  descending: true
  - changeSet:
      id: 20
      author: mirko
      labels: task-milestone-step
      comment: >
        A task belongs to a milestone step (its milestone is the milestone of the step) instead of to a milestone. The
        column is renamed in place to keep the column order of the table; the old values were milestone ids, which
        are not step ids, so they are cleared and the tasks start without a step. Deleting a step clears the link of
        the older task versions that pointed at it (history); the service refuses to delete a step that tasks are in.
      changes:
        - dropForeignKeyConstraint:
            baseTableName: task_version
            constraintName: fk_task_version_milestone
        - sql:
            sql: update task_version set milestone_id = null
        - renameColumn:
            tableName: task_version
            oldColumnName: milestone_id
            newColumnName: milestone_step_id
            columnDataType: uuid
        - addForeignKeyConstraint:
            baseTableName: task_version
            baseColumnNames: milestone_step_id
            constraintName: fk_task_version_milestone_step
            referencedTableName: milestone_step
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex:
            indexName: idx_task_version_milestone_step_id
            tableName: task_version
            columns:
              - column:
                  name: milestone_step_id
  - changeSet:
      id: 21
      author: mirko
      labels: milestone-step-parallel
      comment: >
        The position of a step of a milestone template version is its stage: steps with the same position run in
        parallel. The primary key therefore includes the step template, so a stage can hold several steps.
      changes:
        - dropPrimaryKey:
            tableName: milestone_template_version_step
            constraintName: pk_milestone_template_version_step
        - addPrimaryKey:
            tableName: milestone_template_version_step
            columnNames: milestone_template_version, position, milestone_step_template_id
            constraintName: pk_milestone_template_version_step
  - changeSet:
      id: 22
      author: mirko
      labels: log-entry-single-text
      comment: >
        A log entry version has a single text: the internal text is dropped and the external text is renamed to text.
      changes:
        - dropColumn:
            tableName: log_entry_version
            columnName: text_internal
        - renameColumn:
            tableName: log_entry_version
            oldColumnName: text_external
            newColumnName: text
            columnDataType: text
  - changeSet:
      id: 23
      author: mirko
      labels: export-tombstones
      comment: >
        A tombstone records that an entity of a project was deleted, so that the export can tell the import about the
        deletion and the import does not bring a deleted entity back from an older tree. The entity type is the
        export folder of the entity (tasks, logentries).
      changes:
        - createTable:
            tableName: deleted_entity
            columns:
              - column:
                  name: project_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_deleted_entity_project
                    references: project(id)
                    deleteCascade: true
              - column:
                  name: entity_type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: deleted_entity
            columnNames: project_id, entity_type, entity_id
            constraintName: pk_deleted_entity
