databaseChangeLog:
  - changeSet:
      id: 1
      author: mirko
      labels: table-creation
      context:
      comment: Creates all tables
      changes:
        - createTable:
            tableName: account_type
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: uuidv7()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: last_name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: email
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: account_type_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_account_type_account
                    references: account_type(id)
              - column:
                  name: verified
                  type: boolean
                  defaultValue: false
              - column:
                  name: enabled
                  type: boolean
                  defaultValue: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: organization
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(256)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: project
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_organization_project
                    references: organization(id)
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: task_status
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: project_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_project_task_status
                    references: project(id)
              - column:
                  name: name
                  type: varchar(256)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: description
                  type: varchar(256)
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: task
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: project_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_project_task
                    references: project(id)
              - column:
                  name: name
                  type: varchar(256)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: assigned_to
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_task_assigned_to_account
                    references: account(id)
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_task_created_by_account
                    references: account(id)
              - column:
                  name: closed_by
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_task_closed_by_account
                    references: account(id)
              - column:
                  name: task_status_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_task_status_task
                    references: task_status(id)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: link
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(256)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: url
                  type: varchar(256)
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: task_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_task_link
                    references: task(id)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: log_entry
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: text_internal
                  type: text
                  constraints:
                    nullable: true
                    unique: false
              - column:
                  name: text_external
                  type: text
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: status
                  type: int
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: task_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_task_log_entry
                    references: task(id)
              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_task_created_by_account
                    references: account(id)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: account_session
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_user_account_account_session
                    references: account(id)
              - column:
                  name: session_token
                  type: text
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: device_info
                  type: text
                  constraints:
                    nullable: false
                    unique: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamp with time zone
                  constraints:
                    nullable: true
        - createTable:
            tableName: organization_account
            columns:
              - column:
                  name: organization_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_organization_account_organization
                    references: organization(id)
                    primaryKey: true
              - column:
                  name: account_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_organization_account_account
                    references: account(id)
                    primaryKey: true
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: project_account
            columns:
              - column:
                  name: project_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_project_account_project
                    references: project(id)
                    primaryKey: true
              - column:
                  name: account_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_project_account_account
                    references: account(id)
                    primaryKey: true
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
