                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: change_comment
                  type: text
                  defaultValue: ""
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_milestone_step_version_milestone_step_id_version
            tableName: milestone_step_version
            columns:
              - column:
                  name: milestone_step_id
              - column:
                  name: version
                  descending: true
        - createIndex:
            indexName: idx_milestone_step_milestone_id_id
            tableName: milestone_step
            columns:
              - column:
                  name: milestone_id
              - column:
                  name: id
  - changeSet:
